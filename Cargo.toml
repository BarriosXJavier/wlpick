[package]
name = "wlpick"
version = "0.1.0"
edition = "2021"
description = "Wayland color picker"
license = "GPL 3.0"
repository = "https://github.com/BarriosXJavier/wlpick.git"
readme = "README.md"
keywords = ["wayland", "color picker", "eyedropper"]
category = ["command-line-utilies", ["wayland utilities"]]

[dependencies]
raylib = "5.0"
image = "0.25"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
